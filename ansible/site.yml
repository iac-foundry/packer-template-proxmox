---
# Runs FROM the bootstrap container AGAINST the VM via SSH.
# Packer injects a temporary SSH key before invoking this play —
# no password or sshpass required here.
- name: Ubuntu template SOE baseline
  hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - qemu-guest-agent
          - curl
          - wget
          - ca-certificates
          - apt-transport-https
          - gnupg
          - unzip
          - git
          - vim
        state: present
        install_recommends: false

    - name: Enable qemu-guest-agent
      ansible.builtin.systemd:
        name: qemu-guest-agent
        enabled: true
        state: started

    - name: Allow password authentication during Packer build
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-packer.conf
        content: "PasswordAuthentication yes\n"
        owner: root
        group: root
        mode: "0644"
      notify: Restart sshd

    - name: Remove apt cruft
      ansible.builtin.apt:
        autoremove: true
        autoclean: true

  handlers:
    - name: Restart sshd
      ansible.builtin.systemd:
        name: ssh
        state: restarted
